services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: mysecret
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - ragdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:mysecret@db:5432/ragdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  ragdata: